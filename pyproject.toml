[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quantlab-personal"
version = "0.9.0"
description = "Auditable multi-agent quantitative decision system for personal investors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.1",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
agents = [
  "langgraph>=0.4,<2",
  "openai>=1.80,<3",
  "httpx>=0.27,<1",
]
data = [
  "akshare>=1.16",
  "baostock>=0.9.3,<1",
  "pyarrow>=17",
  "yfinance>=0.2.54",
]
ui = [
  "streamlit>=1.42,<2",
  "plotly>=5.24,<7",
]
api = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
