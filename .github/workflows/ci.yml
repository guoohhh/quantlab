name: QuantLab CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,agents,data,api,ui]"
      - name: Ruff
        run: python -m ruff check src tests dashboard
      - name: Compile
        run: python -m compileall -q src dashboard tests
      - name: Tests and coverage
        env:
          QUANTLAB_LLM_PROVIDER: mock
          QUANTLAB_OPENAI_ENABLED: "false"
          QUANTLAB_DEEPSEEK_ENABLED: "false"
        run: python -m pytest --cov=quantlab --cov-report=term-missing --cov-report=xml --cov-fail-under=71
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
